<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/style.css">
    <title>Groupie Trackers | Home</title>
</head>
<body>
    <header>
        <h1>🎵 Groupie Trackers</h1>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="searchFunction()" placeholder="Search for artists...">
        </div>
    </header>

    <main class="grid-container" id="artistGrid">
        {{range .}}
        <div class="card" data-name="{{.Name}}">
            <div class="card-img" style="background-image: url('{{.Image}}');"></div>
            <div class="card-content">
                <h3>{{.Name}}</h3>
                <p>Since {{.CreationDate}}</p>
                <a href="/artist?id={{.ID}}" class="btn">View Profile</a>
            </div>
        </div>
        {{end}}
    </main>

    <script>
        function searchFunction() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                let name = card.getAttribute('data-name').toLowerCase();
                card.style.display = name.includes(input) ? "block" : "none";
            });
        }
    </script>
</body>
</html>
